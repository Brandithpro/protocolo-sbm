<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo SBM - O Confessionário</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* VARIÁVEIS DE COR E TIPOGRAFIA DE LUXO */
        :root {
            --luxury-gold: #C5A880;
            --luxury-gold-dark: #9A7D56;
            --luxury-cyan: #06B6D4;
            --luxury-dark: #0B0F19;
            --luxury-bg-gray: #FAFAFA;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #ffffff; color: var(--luxury-dark); font-family: var(--font-sans), system-ui, -apple-system, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

        .container { max-width: 896px; margin: 0 auto; padding: 0 24px; }
        .text-center { text-align: center; }
        
        .topbar { background-color: var(--luxury-dark); color: #ffffff; font-size: 11px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.2em; padding: 10px 16px; text-align: center; border-bottom: 1px solid rgba(197, 168, 128, 0.2); }

        header { padding: 24px 0; border-bottom: 1px solid #f3f4f6; background-color: #ffffff; position: sticky; top: 0; z-index: 50; }
        .header-content { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 16px; }
        @media (min-width: 768px) { .header-content { flex-direction: row; } }
        .logo-box { display: flex; align-items: center; gap: 16px; }
        .logo-img-container { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--luxury-gold); overflow: hidden; background-color: var(--luxury-dark); display: flex; align-items: center; justify-content: center; }
        .logo-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .logo-fallback { color: var(--luxury-gold); font-family: var(--font-display); font-size: 14px; font-weight: bold; }
        .logo-text h1 { font-family: var(--font-display); font-size: 18px; font-weight: bold; letter-spacing: 0.15em; line-height: 1; margin-bottom: 4px; }
        .logo-text p { font-size: 9px; letter-spacing: 0.2em; color: var(--luxury-gold); text-transform: uppercase; font-weight: 600; }
        .status-badge { display: none; align-items: center; gap: 8px; }
        @media (min-width: 768px) { .status-badge { display: flex; } }
        .pulse-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; animation: pulse 2s infinite; }

        .hero { padding-top: 48px; padding-bottom: 32px; max-width: 672px; margin: 0 auto; }
        .badge-premium { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 9999px; border: 1px solid rgba(197, 168, 128, 0.3); background-color: var(--luxury-bg-gray); color: var(--luxury-gold-dark); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 24px; }
        .hero h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; color: var(--luxury-dark); margin-bottom: 24px; }
        @media (min-width: 768px) { .hero h2 { font-size: 40px; } }
        .text-highlight { position: relative; display: inline-block; color: var(--luxury-gold); }

        .hero p { color: #4b5563; font-size: 16px; line-height: 1.6; }

        /* VIDEO CONTAINER YOUTUBE */
        .vsl-section { margin-bottom: 56px; }
        .video-wrapper { max-width: 380px; margin: 0 auto; background-color: var(--luxury-dark); border-radius: 24px; padding: 10px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); position: relative; border: 4px solid rgba(197, 168, 128, 0.25); overflow: hidden; }
        .video-tagline { position: absolute; top: 24px; left: 24px; z-index: 10; display: flex; align-items: center; gap: 8px; opacity: 0.8; pointer-events: none; }
        .video-tagline img { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--luxury-gold); }
        .video-tagline span { color: #ffffff; font-family: var(--font-display); font-size: 9px; letter-spacing: 0.15em; text-shadow: 0px 1px 3px rgba(0,0,0,0.8); }
        .video-container { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background-color: #000000; }
        .video-container iframe { width: 100%; height: 100%; object-fit: cover; }

        /* CHECKOUT / OFERTA CARD */
        .offer-section { max-width: 576px; margin: 0 auto 48px auto; }
        .offer-card { background-color: var(--luxury-bg-gray); border: 1px solid #e5e7eb; border-radius: 20px; padding: 24px; }
        @media (min-width: 768px) { .offer-card { padding: 32px; } }
        
        .stars-review { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: #6b7280; font-weight: 600; }
        .stars-review svg { width: 14px; height: 14px; fill: #fbbf24; }
        .offer-header { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
        .offer-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--luxury-gold-dark); font-weight: 700; background-color: rgba(197, 168, 128, 0.1); padding: 4px 12px; border-radius: 999px; }
        
        .pricing { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .price-old { color: #9ca3af; text-decoration: line-through; font-size: 14px; }
        .price-current { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; color: var(--luxury-dark); }
        .price-installment { font-size: 12px; color: #6b7280; font-weight: 500; }
        
        .benefits-list { list-style: none; text-align: left; margin-bottom: 24px; }
        .benefits-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: #4b5563; margin-bottom: 12px; }
        .benefits-list li svg { width: 18px; height: 18px; stroke: #10b981; stroke-width: 2.5; flex-shrink: 0; margin-top: 2px; }
        
        .cta-btn { display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, #0b0f19 0%, #1e293b 100%); color: #ffffff; padding: 16px 24px; border-radius: 12px; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 14px; text-decoration: none; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-bottom: 16px; }
        .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(11, 15, 25, 0.15); }
        
        .guarantee-box { background-color: #ffffff; border: 1px dashed var(--luxury-gold-dark); border-radius: 12px; padding: 16px; display: flex; align-items: flex-start; gap: 16px; text-align: left; margin-top: 24px; }
        .guarantee-box svg { width: 32px; height: 32px; flex-shrink: 0; fill: none; stroke: var(--luxury-gold-dark); stroke-width: 1.5; }
        .guarantee-text h6 { font-size: 13px; font-weight: 700; color: var(--luxury-dark); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-display); }
        .guarantee-text p { font-size: 11px; color: #6b7280; line-height: 1.5; }

        /* BRINDES EXCLUSIVOS */
        .bonuses-section { max-width: 768px; margin: 0 auto 80px auto; padding-top: 48px; border-top: 1px solid #f3f4f6; }
        .bonuses-header { text-align: center; margin-bottom: 32px; }
        .bonuses-header h3 { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--luxury-dark); text-transform: uppercase; letter-spacing: 0.1em; }
        .bonuses-header p { font-size: 13px; color: var(--luxury-gold-dark); font-weight: 600; margin-top: 8px; }
        .bonus-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 640px) { .bonus-grid { grid-template-columns: repeat(3, 1fr); } }
        .bonus-card { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px 16px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .bonus-icon { width: 40px; height: 40px; background-color: rgba(197, 168, 128, 0.1); color: var(--luxury-gold-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }

        .bonus-card h4 { font-size: 13px; font-weight: 700; color: var(--luxury-dark); margin-bottom: 8px; font-family: var(--font-display); }
